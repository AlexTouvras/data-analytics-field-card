name: Trigger Cursor judgment

# Durable Friday binder (API) — same slot as the AI field-card Cursor Automation.
# Discovery CI runs at 12:00 UTC; this kicks judgment at 14:00 UTC (~17:00 EEST).
# Prefers an open chore/weekly-refresh-* PR from discovery; otherwise starts from main.

on:
  schedule:
    - cron: "0 14 * * 5"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve weekly discovery PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          WEEK="chore/weekly-refresh-$(date -u +%Y-W%V)"
          echo "Looking for head branch: $WEEK"
          JSON=$(gh pr list --repo "${{ github.repository }}" --state open --head "$WEEK" --json number,url,headRefName --jq '.[0] // empty')
          if [ -n "$JSON" ] && [ "$JSON" != "null" ]; then
            NUM=$(echo "$JSON" | jq -r .number)
            URL=$(echo "$JSON" | jq -r .url)
            echo "Found PR #$NUM → $URL"
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "pr_number=$NUM" >> "$GITHUB_OUTPUT"
            echo "pr_url=$URL" >> "$GITHUB_OUTPUT"
          else
            echo "No open discovery PR for $WEEK — agent will start from main"
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Start Cursor Cloud Agent (judgment)
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          PR_FOUND: ${{ steps.pr.outputs.found }}
          PR_URL: ${{ steps.pr.outputs.pr_url }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
        run: |
          set -euo pipefail
          if [ -z "${CURSOR_API_KEY:-}" ]; then
            echo "CURSOR_API_KEY secret is missing"
            exit 1
          fi

          PROMPT=$(cat <<'EOF'
          Weekly Data Analytics Field Card judgment for Alex Touvras.

          Repository: AlexTouvras/data-analytics-field-card (branch main).

          Follow docs/weekly-refresh-prompt.md exactly (fail-closed).

          Hard rules:
          - This is NOT a Power BI / Fabric brochure. Keep ASK → GRAIN → TRUTH → USE as the stack.
          - Discovery alone is not enough — every run must end with an explicit update OR no HTML change decision in the PR ## Summary.
          - Do not merge. Do not force-push main. Human Approves in Slack #orbit.
          - Never invent docs URLs.

          Steps:
          1. Prefer open branch chore/weekly-refresh-YYYY-Www for this ISO week; else create/update from main.
          2. Run npm run discover; read data/discovery-report.md and index.html.
          3. Decide update vs no-change; write ## Summary either way.
          4. If updating index.html: tool picker ≤7 by constraint; bump version; fix Changed line; prefer broad analytics language.
          5. Run node scripts/check-links.mjs on any URLs you touched.
          6. Update data/watchlist.json onCard flags as needed.
          7. Commit/push to the weekly PR only.
          8. Rewrite PR body with ## Summary and ## Card preview.
          9. Run: gh workflow run "Notify Slack approve" --repo AlexTouvras/data-analytics-field-card -f pr_number=<PR_NUMBER>
          10. Stop. Human uses Open card preview then Approve/Skip.

          Done when discovery ran, Summary has the decision, link check is clean if HTML changed, and #orbit has preview + Approve/Skip.
          EOF
          )

          # Build JSON payload with jq (handles escaping)
          if [ "${PR_FOUND:-false}" = "true" ]; then
            BODY=$(jq -n \
              --arg text "$PROMPT" \
              --arg name "Analytics field card weekly judgment" \
              --arg repo "https://github.com/AlexTouvras/data-analytics-field-card" \
              --arg pr "$PR_URL" \
              '{
                name: $name,
                prompt: { text: $text },
                repos: [{ url: $repo, prUrl: $pr }],
                workOnCurrentBranch: true,
                autoCreatePR: false
              }')
          else
            BODY=$(jq -n \
              --arg text "$PROMPT" \
              --arg name "Analytics field card weekly judgment" \
              --arg repo "https://github.com/AlexTouvras/data-analytics-field-card" \
              '{
                name: $name,
                prompt: { text: $text },
                repos: [{ url: $repo, startingRef: "main" }],
                workOnCurrentBranch: false,
                autoCreatePR: true
              }')
          fi

          RESP=$(curl -sS -u "${CURSOR_API_KEY}:" \
            -H "Content-Type: application/json" \
            -X POST "https://api.cursor.com/v1/agents" \
            -d "$BODY")

          echo "$RESP" | jq '{agentId: .agent.id, status: .agent.status, url: .agent.url, runId: .run.id, runStatus: .run.status}'
          AGENT_URL=$(echo "$RESP" | jq -r '.agent.url // empty')
          if [ -z "$AGENT_URL" ] || [ "$AGENT_URL" = "null" ]; then
            echo "Failed to create cloud agent:"
            echo "$RESP" | jq .
            exit 1
          fi
          echo "Cloud agent: $AGENT_URL"
